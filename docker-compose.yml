services:
  db:
    image: postgres:16-alpine
    container_name: channeliq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: channeluser
      POSTGRES_PASSWORD: channelpass
      POSTGRES_DB: channeliq
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U channeluser -d channeliq"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: channeliq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
